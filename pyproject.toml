[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inventree-production-planning"
version = "0.2.5"
description = "V2 recursive production planning forecast for InvenTree Build Orders."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Per Vices Corporation"}]

[project.entry-points."inventree_plugins"]
ProductionPlanningPlugin = "inventree_production_planning.plugin:ProductionPlanningPlugin"

[tool.setuptools]
packages = ["inventree_production_planning"]
include-package-data = true

[tool.setuptools.package-data]
inventree_production_planning = ["static/*.js"]
